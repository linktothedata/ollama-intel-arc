name: Build ollama-sycl

# Builds eleiton/ollama-intel-arc's ollama-sycl Dockerfile and publishes to
# ghcr.io/linktothedata/ollama-sycl so compose can just pull :latest.
#
# That Dockerfile builds libggml-sycl.so from Ollama source against oneAPI,
# then drops it next to the official Ollama binary on a slim runtime that
# includes the Intel GPU user-space drivers.

on:
  workflow_dispatch:
    inputs:
      ollama_version:
        description: 'Ollama version to build (empty = whatever the Dockerfile pins)'
        required: false
        default: ''
      source_ref:
        description: 'Ref of eleiton/ollama-intel-arc to build from'
        required: false
        default: 'main'
  schedule:
    # Sundays 07:00 UTC - an hour after the llama-sycl build
    - cron: '0 7 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ollama-sycl

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write

    steps:
      # oneAPI build images are huge; default runners have ~14 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Checkout ollama-intel-arc
        uses: actions/checkout@v4
        with:
          repository: eleiton/ollama-intel-arc
          ref: ${{ github.event.inputs.source_ref || 'main' }}
          fetch-depth: 1

      - name: Build args
        id: args
        env:
          OV: ${{ github.event.inputs.ollama_version }}
        run: |
          set -euo pipefail
          if [ -n "$OV" ]; then
            echo "build_args=OLLAMA_VERSION=$OV" >> "$GITHUB_OUTPUT"
            echo "tag=$OV" >> "$GITHUB_OUTPUT"
          else
            # Use the Dockerfile's own pin; tag the image by date instead.
            echo "build_args=" >> "$GITHUB_OUTPUT"
            echo "tag=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ollama-sycl
          file: ./ollama-sycl/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: ${{ steps.args.outputs.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.args.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Summary
        run: |
          {
            echo "### ollama-sycl built"
            echo ""
            echo "- image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`"
            echo "- also tagged: \`${{ steps.args.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
